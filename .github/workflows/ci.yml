name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      # The gate is .golangci.yml; formatters (gofmt, goimports) are part of the
      # same run, so a formatting diff fails here too.
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: build, vet, unit tests
        run: |
          CGO_ENABLED=0 go build ./...
          go vet ./...
          go test ./... -count=1

  integration:
    runs-on: ubuntu-latest
    # The service is reachable over TCP only, so the DSN here is not the unix
    # socket a local run uses. The database is a throwaway container: the suite
    # drops and recreates the public schema on every test.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hookvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hookvault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HOOKVAULT_TEST_DATABASE_URL: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=hookvault_test sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: tests against PostgreSQL 18
        run: CGO_ENABLED=0 go test ./... -count=1

  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.1.0
      # Consumers (atelie-server) build this flake, so vendorHash and the go
      # directive have to be right in the commit, not at deploy time.
      - name: nix build
        run: nix build . --print-build-logs
      - name: the artifact reports its version
        run: ./result/bin/hook-vault version
