{{define "content"}}{{end}}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .Title}}{{.Title}} · {{end}}hook-vault</title>
  <script>
    // Apply the stored theme before first paint — no flash of the wrong theme.
    (function () {
      var t = localStorage.getItem('hv-theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <a class="brand" href="/">hook-vault</a>
    <div class="header-actions">
      <button class="icon-btn" type="button" id="theme-toggle" aria-label="Toggle color theme" title="Toggle color theme">
        <svg class="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3.2"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M13 3l-1.4 1.4M4.4 11.6L3 13"/></svg>
        <svg class="icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 9.7A5.5 5.5 0 1 1 6.3 2.5a4.3 4.3 0 0 0 7.2 7.2Z"/></svg>
      </button>
      {{if .LoggedIn}}<a class="button small" href="/logout">log out</a>{{end}}
    </div>
  </header>
  <main>
    {{if .Flash}}<div class="card">{{.Flash}}</div>{{end}}
    {{block "content" .}}{{end}}
  </main>
  <footer>hook-vault {{.Version}} · ciphertext only — keys live with the consumer</footer>
  <script>
    // The manual choice wins over the system until cleared from localStorage.
    (function () {
      var root = document.documentElement;
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      document.getElementById('theme-toggle').addEventListener('click', function () {
        var resolved = root.dataset.theme || (mq.matches ? 'dark' : 'light');
        var next = resolved === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        localStorage.setItem('hv-theme', next);
      });
    })();
  </script>
  {{block "scripts" .}}{{end}}
</body>
</html>
