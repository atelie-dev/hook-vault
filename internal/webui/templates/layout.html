{{define "content"}}{{end}}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .Title}}{{.Title}} · {{end}}hook-vault</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <a class="brand" href="/">hook-vault</a>
    {{if .LoggedIn}}<form method="post" action="/logout"><button class="small" type="submit">log out</button></form>{{end}}
  </header>
  <main>
    {{if .Flash}}<div class="card">{{.Flash}}</div>{{end}}
    {{block "content" .}}{{end}}
  </main>
  <footer>hook-vault {{.Version}} · ciphertext only — keys live with the consumer</footer>
  {{block "scripts" .}}{{end}}
</body>
</html>
